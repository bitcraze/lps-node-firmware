# Build and unit test in an Ubuntu 22.04 container with the same apt toolchain
# as the bitcraze/builder:41 image used for releases, without pulling the full
# image.
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron:  '30 16 * * 3'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 15

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates git gcc libc6-dev rake python-is-python3

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Mark workspace as safe for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Unit tests
      run: ./tools/build/test

  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 15

    steps:
    - name: Install toolchain
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates git make python3 \
          gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Mark workspace as safe for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Build
      run: ./tools/build/make

    - name: Build long range
      run: |
        ./tools/build/make clean
        ./tools/build/make "EXTRA_CFLAGS=-DLPS_LONGER_RANGE"
