# Build the project using the Bitcraze builder docker image
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly build to make sure dependencies are OK
    - cron:  '30 16 * * 3'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Unit tests
      run: docker run --rm -v ${PWD}:/module bitcraze/builder ./tools/build/test

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Build
      run: docker run --rm -v ${PWD}:/module bitcraze/builder ./tools/build/make
    - name: Build long range
      run: |
        docker run --rm -v ${PWD}:/module bitcraze/builder ./tools/build/make clean
        docker run --rm -v ${PWD}:/module bitcraze/builder ./tools/build/make "EXTRA_CFLAGS=-DLPS_LONGER_RANGE"
